version: '3'
info:
  companyName: xibolun
  productName: Bible
  productIdentifier: io.github.xibolun.bible
  description: Offline Bible reader
  copyright: Bible contributors
  comments: Chinese-English scripture comparison and cards
  version: 0.3.0
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin, dist, .cache, licenses]
    file: [.DS_Store, .gitignore, '*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 task build DEV=true
      type: blocking
    - cmd: wails3 task frontend:dev
      type: background
      readiness:
        http: http://127.0.0.1:5173/
        timeout: 60s
        interval: 200ms
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
