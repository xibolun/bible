name: Desktop packages
run-name: Desktop packages ${{ inputs.version || 'checks' }} (${{ github.ref_name }})
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Internal package version
        default: v0.3.0
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.version || 'v0.3.0' }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check formatting and Python regressions
        run: |
          test -z "$(gofmt -l main.go internal)"
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check frontend and build embedded assets
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test -- --run
          npm run build
      - name: Check Go logic and desktop compilation without packaging
        run: |
          go vet ./internal/...
          go test ./internal/...
          mkdir -p .cache
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags production -o .cache/bible-compile-check.exe .
      - name: Check bundled data and branding
        run: |
          make verify-data
          make verify-branding
  browser:
    runs-on: ubuntu-24.04
    env:
      BIBLE_APP_VERSION: ${{ inputs.version || 'v0.3.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-results
          path: |
            frontend/test-results
            frontend/playwright-report
  native:
    # Release callers supply ref; PRs run only the fast checks and browser jobs.
    if: github.event_name == 'workflow_dispatch' || inputs.ref != ''
    name: ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: windows-2025
            os: windows
            arch: amd64
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      VERSION: ${{ inputs.version || 'v0.3.0' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate package version
        id: version
        run: python -c "import os,re; assert re.fullmatch(r'v?[0-9]+[.][0-9]+[.][0-9]+',os.environ['VERSION'])"
      - name: Install declared build tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install make nsis --no-progress --yes
          "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
          "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
      - name: Install declared Linux build and smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev dpkg-dev desktop-file-utils xvfb xauth dbus-x11 at-spi2-core apparmor python3-gi gir1.2-gtk-4.0
          desktop-file-validate build/linux/io.github.xibolun.bible.desktop
      - name: Install pinned CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Check and package
        run: make package GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} VERSION="$VERSION"
      - name: Resolve packaged Linux desktop icons through GTK4
        if: runner.os == 'Linux'
        run: |
          mkdir -p .cache/desktop-install
          dpkg-deb --extract "dist/$VERSION/bible-$VERSION-linux-${{ matrix.arch }}.deb" .cache/desktop-install
          GDK_BACKEND=x11 xvfb-run -a /usr/bin/python3 tools/verify_linux_desktop.py --share .cache/desktop-install/usr/share
      - name: Permit WebKit sandbox namespaces for the CI application
        if: runner.os == 'Linux'
        env:
          BIBLE_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          profile = Path('build/linux/io.github.xibolun.bible.apparmor').read_text()
          binary = Path(os.environ['GITHUB_WORKSPACE']) / 'bin' / ('linux-' + os.environ['BIBLE_TARGET_ARCH']) / 'Bible'
          Path(os.environ['RUNNER_TEMP'], 'bible-smoke.apparmor').write_text(profile.replace('/usr/bin/bible', str(binary)))
          PY
          sudo apparmor_parser -r "$RUNNER_TEMP/bible-smoke.apparmor"
      - name: Exercise native WebView and Go bridge twice
        if: runner.os != 'Linux'
        run: make smoke GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} VERSION="$VERSION"
      - name: Exercise Linux WebView and Go bridge twice
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' make smoke GOOS=linux GOARCH=${{ matrix.arch }} VERSION="$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        with:
          name: bible-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ inputs.version || 'v0.3.0' }}/
          if-no-files-found: error
  collect:
    if: github.event_name == 'workflow_dispatch' || inputs.ref != ''
    needs: [browser, native]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version || 'v0.3.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bible-*
          path: dist/${{ inputs.version || 'v0.3.0' }}/
          merge-multiple: true
      - run: python3 tools/project.py dist --version "$VERSION"
      - name: Validate the complete release bundle without publishing
        run: python3 tools/release.py validate --tag "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bible-${{ inputs.version || 'v0.3.0' }}-all-targets
          path: dist/${{ inputs.version || 'v0.3.0' }}/
          if-no-files-found: error
