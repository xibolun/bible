name: Desktop packages
on:
  push:
    branches: ['issue/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Internal package version
        default: v0.1.0
        required: true
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-results
          path: |
            frontend/test-results
            frontend/playwright-report
  native:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: windows-2025
            os: windows
            arch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      VERSION: ${{ inputs.version || 'v0.1.0' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate package version
        id: version
        run: python -c "import os,re; assert re.fullmatch(r'v?[0-9]+[.][0-9]+[.][0-9]+',os.environ['VERSION'])"
      - name: Install declared build tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install make nsis --no-progress --yes
          "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
          "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
      - name: Install pinned CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Check and package
        run: make package GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} VERSION="$VERSION"
      - name: Exercise native WebView and Go bridge twice
        run: make smoke GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} VERSION="$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        with:
          name: bible-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ inputs.version || 'v0.1.0' }}/
          if-no-files-found: error
  collect:
    needs: [browser, native]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version || 'v0.1.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bible-*
          path: dist/${{ inputs.version || 'v0.1.0' }}/
          merge-multiple: true
      - run: python3 tools/project.py dist --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: bible-${{ inputs.version || 'v0.1.0' }}-all-targets
          path: dist/${{ inputs.version || 'v0.1.0' }}/
          if-no-files-found: error
