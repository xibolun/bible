name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'xibolun/bible'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve a version tag merged into main
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tools/release.py prepare --tag "$RELEASE_TAG"
  packages:
    needs: prepare
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read
  publish:
    needs: [prepare, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bible-${{ needs.prepare.outputs.version }}-all-targets
          path: dist/${{ needs.prepare.outputs.version }}/
      - name: Validate and publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/release.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
